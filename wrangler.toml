name = "carbook"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "carbook_db"
database_id = "40043b05-231b-426b-bcf8-57a2fc771664"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "959acaeafb904de4a3fafcfff7bbc931"

[[kv_namespaces]]
binding = "IMAGES_KV"
id = "f6a831e390164837afbbcce7ffb8bae4"

# USER_HASH_SALT salts the anonymous per-commenter rate-limit hash. Not
# committed here in plaintext — set via `wrangler secret put USER_HASH_SALT`
# (or CI secret, see README). For local dev, use a git-ignored `.dev.vars`.
