name = "driver-signal"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "driver_signal_db"
database_id = "51c14e60-55bd-4497-a6d8-e53a6e6c68f8"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "a160a7c7acea41efa7e32c7ef826d356"

[[kv_namespaces]]
binding = "IMAGES_KV"
id = "d1b6d1566f464977a87ae657768b3124"

# USER_HASH_SALT is intentionally not defined here as a [vars] entry: it
# salts the anonymous user hash, and a salt committed in plaintext would
# make that hash easier to precompute against. Set it as a Worker secret
# instead: `wrangler secret put USER_HASH_SALT` (or via CI, see README).
# For local dev, put it in a git-ignored `.dev.vars` file.
